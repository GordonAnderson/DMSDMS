; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; A plain "pio run" (and the VS Code Build/Upload buttons) use only this environment. Change it to
; waveforms to work on the other module, or name one with -e, for example: pio run -e waveforms -t upload
; To build both, run: pio run -e cvbias -e waveforms
default_envs = cvbias

[env]
platform = atmelsam
board = adafruit_feather_m4
framework = arduino
board_vendor = GAA Custom Electronics, LLC
board_build.variants_dir = variants
; Use the Arduino USB stack, as the Arduino IDE build did (its default). The Wire, SPI and ZeroDMA
; libraries include TinyUSB inside #ifdef USE_TINYUSB, which the library finder does not evaluate,
; so it is ignored here explicitly. Do not add -DUSE_TINYUSB, it changes the USB serial stack.
lib_ignore = Adafruit TinyUSB Library
build_flags =
; Copies the .bin to firmware/ with the version number in the name
extra_scripts = post:copy_firmware.py

lib_deps =
    https://github.com/GordonAnderson/ArduinoThread.git
    https://github.com/cmaglie/FlashStorage.git

; FIRMWARE values: 0 = CVBIAS, 1 = WAVEFORMS (see DMSDMSMB.h)
[env:cvbias]
board_build.usb_product = CVBIAS
build_flags =
    ${env.build_flags}
    -DFIRMWARE=0
; The BME280 environmental sensor is only on the CVBIAS module
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BME280 Library

[env:waveforms]
board_build.usb_product = WAVEFORMS
build_flags =
    ${env.build_flags}
    -DFIRMWARE=1
